name: Full-stack CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: dGVzdC1vbmx5LWNpLWtleS1maXh0dXJlLTAxMjM0NTY3ODlhYmNkZWZnaGlqa2xtbg==
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B verify
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 1.giris
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 1.giris/package-lock.json
      - name: Refresh frontend dependency lock for review
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts || true
          echo AUDIT_LOCK_BEGIN_20261030
          cat package-lock.json
          echo AUDIT_LOCK_END_20261030
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm audit --omit=dev --audit-level=high
