server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/leaves;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: t2-leave-approval
    ttl-minutes: 30
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
    email: ${ADMIN_EMAIL:admin@localhost.invalid}
